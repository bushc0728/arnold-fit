<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090D">
<meta name="color-scheme" content="dark">
<meta name="description" content="Arnold Fit — a simple workout planner and logger.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arnold Fit">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<title>Arnold Fit</title>
</head>
<body>
<main id="view"></main>
<div id="dock" class="hidden"></div>
<nav id="tabs" aria-label="Sections">
  <button data-a="tab" data-tab="today" class="on" aria-label="Today">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
    <span>Today</span>
  </button>
  <button data-a="tab" data-tab="plan" aria-label="Plan">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
    <span>Plan</span>
  </button>
  <button data-a="tab" data-tab="history" aria-label="History">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M7 16l3.5-4 3 2.5L18 8"/><path d="M14 8h4v4"/></svg>
    <span>History</span>
  </button>
</nav>
<div id="log" class="hidden"></div>
<div id="sheet"></div>
<div id="toast" role="status"></div>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
