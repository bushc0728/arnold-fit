<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090D">
<meta name="color-scheme" content="dark">
<meta name="description" content="Arnold Fit — Christopher's hybrid training, food, habits, daily devotional & motivation — Oct 5 → Dec 31 2026.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="tabgrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="24" y2="24"><stop offset="0" stop-color="#FF7A3D"/><stop offset="1" stop-color="#FF2E63"/></linearGradient></defs></svg>
<header id="topbar" aria-hidden="true"><div class="tb-in" id="tbTitle"></div></header>
<main id="view" aria-live="polite"><div class="boot" aria-label="Loading"><div class="oblogo">AF</div></div></main>
<nav id="tabbar" aria-label="Tabs">
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg><span class="lbl">Today</span></button>
  <button data-tab="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span class="lbl">Train</span></button>
  <button data-tab="food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M17 21V3c-2 1.5-3 4-3 7s1 4 3 4"/></svg><span class="lbl">Food</span></button>
  <button data-tab="fuel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.5H11L10 22l8.5-11.5H12L13 2z"/></svg><span class="lbl">Fuel</span></button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 19.5h17M6 15l4-4.5 3.5 3L19 7"/><path d="M15 7h4v4"/></svg><span class="lbl">Progress</span></button>
</nav>
<div id="workout" class="overlay hidden"></div>
<div id="coach" class="overlay coach hidden"></div>
<div id="devo" class="overlay devo hidden" role="dialog" aria-label="Daily devotional"></div>
<div id="onboard" class="overlay onboard hidden"></div>
<div id="sheet-root"></div>
<div id="toast" role="status"></div>
<div id="net" role="status" aria-live="polite">Offline · everything still saves on this phone</div>
